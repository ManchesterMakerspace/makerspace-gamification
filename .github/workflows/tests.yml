name: Ledger tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,anomaly]'
      - run: python -m ledger.prompt_library
      - run: python -m ledger.prompt_matrix
      - name: Verify prompt assets in wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          from ledger.prompt_library import TYPES
          from ledger.prompt_matrix import validate_matrix
          with ZipFile(next(Path('dist').glob('makerspace_ledger-*.whl'))) as wheel:
              names = [name for name in wheel.namelist() if name.startswith('ledger/prompts/') and name.endswith('.json')]
              assert {Path(name).stem for name in names} == set(TYPES)
              assert all(len(json.loads(wheel.read(name))['variations']) >= 3 for name in names)
              validate_matrix(wheel.read('ledger/prompts/prompt_matrix.xml.md').decode('utf-8'))
          PY
      - name: Validate Compose without starting services
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
        env:
          LEDGER_LLM_API_KEY: test-only-inference-key
          CLOUDFLARE_TUNNEL_TOKEN: test-only-tunnel-token
      - name: Run ordinary tests
        run: python -m pytest -m "not mongo_integration" --strict-markers
  mongo-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Official 8.0.34-noble manifest verified against Docker Registry.
      MONGO_TEST_IMAGE: mongo:8.0.34-noble@sha256:c2d54fddfb3738fb27fe117f51692e3f44e640a3e7aeb8da3937ee9cd33a650b
      LEDGER_TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,anomaly]'
      - name: Start disposable Mongo replica set
        timeout-minutes: 5
        run: bash scripts/ci/start-mongo.sh
      - name: Run Mongo integration tests
        run: python -m pytest -m mongo_integration --strict-markers
      - name: Mongo diagnostics before cleanup
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' ledger-mongo || true
          docker logs --timestamps --tail=200 ledger-mongo || true
      - name: Remove disposable database server
        if: always()
        run: docker rm -fv ledger-mongo || true
