name: Ledger tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m ledger.prompt_library
      - name: Verify prompt assets in wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          from ledger.prompt_library import TYPES
          with ZipFile(next(Path('dist').glob('makerspace_ledger-*.whl'))) as wheel:
              names = [name for name in wheel.namelist() if name.startswith('ledger/prompts/') and name.endswith('.json')]
              assert {Path(name).stem for name in names} == set(TYPES)
              assert all(len(json.loads(wheel.read(name))['variations']) >= 3 for name in names)
          PY
      - name: Validate Compose without starting services
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
        env:
          LEDGER_LLM_API_KEY: test-only-inference-key
          CLOUDFLARE_TUNNEL_TOKEN: test-only-tunnel-token
      - name: Start disposable Mongo replica set
        run: |
          docker run -d --name ledger-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec ledger-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec ledger-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec ledger-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) { quit(1); }'; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python -m pytest
        env:
          LEDGER_TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
      - name: Remove disposable database server
        if: always()
        run: docker rm -f ledger-mongo
